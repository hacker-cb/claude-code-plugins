name: Validate

# NOTE: deliberately no `paths:` filter. The job below publishes the status check
# `Validate marketplace & plugins`, which the default-branch ruleset lists as
# REQUIRED. A path-filtered workflow simply does not run when nothing matches, so
# the required check never reports — and GitHub treats "required but never
# reported" as blocking, not as passing. That left every docs-only PR (README,
# CLAUDE.md, CONTRIBUTING.md, LICENSE) permanently un-mergeable. Running always
# costs about a minute of runner time; do not re-add a filter here unless you also
# drop the check from the ruleset's required list.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace & plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Fast, deterministic gate (jq + naming convention). No auth needed.
      - name: Structural validation
        run: bash scripts/validate.sh

      # The review scripts, against saved envelopes. A stub plays the CLI, so this
      # needs no engine, no account and no network — and no history either: the runs
      # are pinned to an empty range, which a shallow checkout satisfies.
      - name: Script tests
        run: bash tests/run.sh

      # Internal paths only: `--offline` skips every http(s) URL in the repo, so
      # no link in this repo is resolved over the network and a docs host having
      # a bad day cannot fail a PR. The action itself still downloads the lychee
      # binary, so the step is not network-free — it just does not depend on any
      # host this repo links to. External URLs rot with time rather than with a
      # PR, and are checked on a schedule by link-check.yml instead.
      - name: Link check (internal paths)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md' '.claude/**/*.md'
          fail: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Authoritative schema + frontmatter validation via the official CLI.
      - name: Official plugin validation (claude CLI)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          for d in plugins/*/ external_plugins/*/; do
            [ -d "$d" ] || continue
            claude plugin validate "$d"
          done
