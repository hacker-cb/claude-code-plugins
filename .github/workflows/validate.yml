name: Validate

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'plugins/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'plugins/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace & plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Fast, deterministic gate (jq + naming convention). No auth needed.
      - name: Structural validation
        run: bash scripts/validate.sh

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Authoritative schema + frontmatter validation via the official CLI.
      - name: Official plugin validation (claude CLI)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          for d in plugins/*/; do
            claude plugin validate "$d"
          done
