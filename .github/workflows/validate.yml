name: Validate

# NOTE: deliberately no `paths:` filter. The job below publishes the status check
# `Validate marketplace & plugins`, which the default-branch ruleset lists as
# REQUIRED. A path-filtered workflow simply does not run when nothing matches, so
# the required check never reports — and GitHub treats "required but never
# reported" as blocking, not as passing. That left every docs-only PR (README,
# CLAUDE.md, CONTRIBUTING.md, LICENSE) permanently un-mergeable. Running always
# costs about a minute of runner time; do not re-add a filter here unless you also
# drop the check from the ruleset's required list.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace & plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Fast, deterministic gate (jq + naming convention). No auth needed.
      - name: Structural validation
        run: bash scripts/validate.sh

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Authoritative schema + frontmatter validation via the official CLI.
      - name: Official plugin validation (claude CLI)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          for d in plugins/*/ external_plugins/*/; do
            [ -d "$d" ] || continue
            claude plugin validate "$d"
          done
