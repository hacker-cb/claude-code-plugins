name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create (annotated) and release, e.g. v0.1.0'
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    name: Package & publish .skill files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Manual run: create an annotated tag at the current commit and push it.
      # (The runner is not behind the dev sandbox's git proxy, so it can push
      # tags.) A direct `git push origin v*` still triggers the release below.
      - name: Create annotated tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Package skills into .skill files
        run: bash scripts/package-skills.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: skills
          path: dist/*.skill
          if-no-files-found: error

      - name: Attach .skill files to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*.skill
          fail_on_unmatched_files: true
          generate_release_notes: true
