# review-round.mjs — the one writer of a review round's work directory.
#
# Every case is a CHAIN of subcommands, run by drive.sh the way a round runs them inside
# a TMPDIR of its own (a round lives under $TMPDIR/hcb-review): `task` means nothing
# without the queue `queue` left, nor `queue` without the units before it. Only the last
# step's answer is printed. Git is a PROXY over a scratch repository each envelope
# describes (stub/git): what the script reads is a working tree against a merge base,
# and a stand-in inventing those answers would test its own idea of a checkout.
script	tests/suites/review-round/drive.sh

# Fixed because the script compares nothing git translates, and a case asserting the
# English words of a refusal should not depend on the caller's locale either.
env	LC_ALL=C
