# labels.mjs apply — a plan written onto a forge, read back, and resumed over its journal.
#
# Every case is a RUN of apply (or two over one journal), driven by drive.sh against a stub forge
# that keeps its label set and each carrier's labels in a state file: what a write left is what the
# next read answers, label-write.mjs's reads and writes included. The drive prints each answer,
# every write the forge took in order, and the state it ended in.
script	tests/suites/labels-apply/drive.sh
env	LC_ALL=C
