# What this suite runs, and the environment it runs in. Everything else a suite
# needs is the directory around this file: `cases.tsv`, `fixtures/`, `stub/`.
#
# One `key value` per line; `env` may repeat. Paths are relative to the repo root.

script	plugins/hcb-dev/skills/codex-review/scripts/codex-review.sh

# `HEAD` for the reason claude-review's suite gives — an empty range needs no
# history. Nothing here reaches it: every case so far is refused while the
# arguments are still being read, which is well before the base is used.
args	--base HEAD
