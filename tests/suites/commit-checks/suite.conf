# commit-checks.mjs — what the two check feeds say about one commit.
#
# `gh` is stubbed outright, not proxied: every call this script makes reaches a forge, so
# there is no half that could safely fall through to the real CLI. Two of the fixtures
# point at captures taken from a real pull request — a hand-written envelope would teach
# the script the shape its author imagined, and the shapes that cost work here (a name
# repeated across matrix legs, a rollup of `pending` over zero statuses) are exactly the
# ones nobody imagines.
script plugins/hcb-dev/scripts/commit-checks.mjs
