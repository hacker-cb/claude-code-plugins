# What this suite runs, and the environment it runs in. Everything else a suite
# needs is the directory around this file: `cases.tsv`, `fixtures/`, `stub/`.
#
# One `key value` per line; `env` may repeat. Paths are relative to the repo root.

script	plugins/hcb-dev/skills/claude-review/scripts/claude-review.sh

# The base is `HEAD` on purpose: the range is empty, so the run needs no history
# beyond the checkout it is in — a shallow CI clone included — and the count the
# record prints is not what these cases are about. The level is the cheapest rung;
# nothing here reaches an engine that would spend it.
args	--base HEAD --level low

# Fixed because the script lowercases its engine's words before matching them
# (`claude-review.sh:252,275`, `tr '[:upper:]' '[:lower:]'`), and that translation is
# locale-dependent on non-ASCII: under C it leaves Cyrillic alone, under a UTF-8
# locale it folds it. A suite inheriting the caller's locale would therefore classify
# a Cyrillic envelope differently per machine. The length comparison further down
# that script is NOT a reason — it counts with `wc -c` precisely so the locale cannot
# reach it.
env	LC_ALL=C
