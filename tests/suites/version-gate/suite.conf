# version-gate.sh — every plugin a change touches lands with a version above the base's.
#
# Git is a PROXY over a scratch repository each envelope describes (see stub/git): what
# the script reads is a merge and the trees around it, and a stand-in inventing those
# answers would test its own idea of a merge. Every case evaluates branch `pr` against
# branch `base` of that repository.
script	scripts/version-gate.sh
args	--base base --head pr
