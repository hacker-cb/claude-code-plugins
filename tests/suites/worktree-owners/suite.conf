# worktree-owners.mjs — whose is each worktree of this repository right now.
#
# `git` is stubbed outright: every question it is asked here would otherwise answer about
# the runner's own checkout. The live-session registry is a DIRECTORY rather than a CLI,
# so nearly every case points `CLAUDE_CONFIG_DIR` at one of the trees under `registry/`
# (the exception blanks it along with `HOME`, to pin what answers when no directory is
# named at all) — which
# is why two pids appear throughout: `1` exists on every host (as EPERM where it is not
# ours to signal, which is exactly the case the shell probe got wrong), and `999999` is
# above any pid a host hands out, so it answers ESRCH.
#
# Two things the fixtures deliberately leave out. `pidDomain` is named only by the case
# about a foreign one: pinning it would make every record foreign on the other platform,
# and CI does not run the platform this was written on. And no record can be at or above
# the runner's own directory, so the run never finds itself in the registry — which is
# why the worktree a case stands in shows the blocker for a session it cannot match to
# itself rather than a clean verdict. That path is the live one, checked by hand.
script plugins/hcb-dev/scripts/worktree-owners.mjs
