# platform-status.mjs — whether the platform itself is down, and whether the component a
# parked step waits on is back.
#
# `curl` is stubbed rather than proxied: every case here is about what somebody else's
# status service answered, and a case resting on the real one would test whichever
# afternoon it ran on. What keeps a case off the network is the runner's own PATH and the
# marker it checks, not the stub — the stub's two guards hold something else, and exit 9
# when they fail: that `-q -g` leads the invocation, and that the url handed over is the
# normalized one. Neither can be seen in any answer the script prints.
#
# The feed url is the suite's, not each case's: the stub answers from the envelope
# whatever url it is handed, and a case that needs a DIFFERENT url passes its own — the
# last --feed wins, which is how the argument guards below are written.
script plugins/hcb-dev/scripts/platform-status.mjs
args --feed https://status.example.test/api/v2/summary.json
