# master-tree.mjs — may a master session's own tree move onto its base, and did it.
#
# `git` is stubbed outright: every question here would otherwise answer about the
# runner's own checkout. The one state the stub keeps is where a switch left HEAD, and
# it keeps it in the marker file the runner clears before every case — so a case can
# see the tree re-read after the move, and no case inherits another's.
script plugins/hcb-dev/scripts/master-tree.mjs
