# default-branch.mjs — which branch this repository treats as its default.
#
# Git is stubbed as a PROXY: real for everything except the three questions whose answer
# would come from a network or from the shape of the checkout. `actions/checkout` does
# not create `refs/remotes/<remote>/HEAD`, so a case resting on the developer's clone
# would pass here and fail in CI — testing the checkout rather than the script.
script plugins/hcb-dev/scripts/default-branch.mjs
