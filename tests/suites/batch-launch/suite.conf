# What this suite runs, and the environment it runs in. drive.sh builds the fake account
# each case runs against; everything else is the directory around this file.
#
# One `key value` per line; `env` may repeat. Paths are relative to the repo root.

script	tests/suites/batch-launch/drive.sh

# Whatever the machine running the suite carries is not the case's: a developer inside
# agterm, or under an aimux profile, would otherwise hand every case their own session.
env	AGTERM_SOCKET=
env	AGTERM_SESSION_ID=
env	AGTERM_WINDOW_ID=
env	CLAUDE_CONFIG_DIR=
env	LC_ALL=C
